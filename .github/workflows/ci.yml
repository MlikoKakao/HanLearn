name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore HanLearn.slnx

      - name: Build
        run: dotnet build HanLearn.slnx --configuration Release --no-restore

      - name: Run tests
        run: >-
          dotnet test HanLearn.slnx --configuration Release --no-build
          --logger trx --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_attempt }}
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

      # Only package default-branch code after the build and tests succeed.
      - name: Publish application
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: >-
          dotnet publish src/HanLearn.Web/HanLearn.Web.csproj
          --configuration Release --no-build --output artifacts/web

      - name: Upload application
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@v4
        with:
          name: hanlearn-web-${{ github.sha }}
          path: artifacts/web/
          if-no-files-found: error
          retention-days: 14
